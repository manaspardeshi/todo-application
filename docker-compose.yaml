services:
  todo-application:
    image: manaspardeshi2000/todo-application:latest
    container_name: todo-application-1
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/tododb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Root@123
    depends_on:
      - mysql-db
    networks:
      - todo-network  

  mysql-db:
    image: mysql:8.0
    container_name: mysql-db-1
    environment:
      MYSQL_ROOT_PASSWORD: Root@123
      MYSQL_DATABASE: tododb
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - todo-network  

volumes:
  mysql-data:
    name: mysql-data

networks:
  todo-network:
    name: todo-network
    driver: bridge  