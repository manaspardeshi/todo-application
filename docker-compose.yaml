services:
  todo-application:
    image: todo-application-image:latest
    container_name
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8082:8081"
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/tododb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_password: "Root@123"
    networks:
      - todo-network

  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "Root@123"
      MYSQL_DATABASE: tododb
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-pRoot@123"] 
      interval: 10s
      timeout: 5s
      retries: 5
    newtorks:
      - todo-network

newtorks:
  todo-network:
    driver: bridge

volumes:
  mysql-data:
    name: mysql-data                 

