services:
  todo-application:
    image: manaspardeshi2000/todo-application:latest
    container_name: todo-application
    networks:
      - todo-network
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/tododb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_password: "Root@123"
    depends_on:
      - mysql

  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: "Root@123"
      MYSQL_DATABASE: tododb
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

newtorks:
  todo-network:
    driver: bridge

volumes:
  mysql-data:
    name: mysql-data                 

